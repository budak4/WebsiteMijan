name: novnc-desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Install desktop + VNC + noVNC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xfce4 xfce4-terminal x11vnc novnc websockify \
            git curl jq >/dev/null 2>&1
          sudo apt-get install -y -qq ca-certificates >/dev/null 2>&1
          curl -L -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

      - name: Start desktop + noVNC
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          startxfce4 &
          sleep 4
          x11vnc -storepasswd sshhmm1900 /tmp/vncpass
          x11vnc -display :99 -rfbport 5900 -forever -shared -rfbauth /tmp/vncpass &
          for i in $(seq 1 10); do
            ss -tlnp | grep -q 5900 && break
            sleep 2
          done
          websockify --web=/usr/share/novnc 6080 localhost:5900 &
          for i in $(seq 1 10); do
            ss -tlnp | grep -q 6080 && break
            sleep 2
          done
          sleep 2
          echo "noVNC services started"
          ss -tlnp | grep -E '5900|6080' || true
          ps aux | grep -E 'Xvfb|x11vnc|websockify|xfce' | grep -v grep || true

      - name: Diagnostics
        run: |
          {
            echo "=== listening ports ===";
            ss -tlnp;
            echo "=== processes ===";
            ps aux | grep -E 'Xvfb|x11vnc|websockify|xfce' | grep -v grep;
            echo "=== vncpass file ===";
            ls -la /tmp/vncpass;
            echo "=== test 6080 ===";
            curl -s -o /dev/null -w "local6080=%{http_code}\n" http://localhost:6080/vnc.html;
          } > /tmp/opencode/diag.txt 2>&1 || true
          cat /tmp/opencode/diag.txt

      - name: Start cloudflared tunnel
        run: |
          /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "DESKTOP_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL" > desktop-url.txt
          echo "::notice title=Open Desktop::Buka URL ini dalam browser (password: sshhmm1900) -> $URL"

      - name: Upload desktop URL
        uses: actions/upload-artifact@v4
        with:
          name: desktop-url
          path: desktop-url.txt
          include-hidden-files: true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: /tmp/opencode/diag.txt
          include-hidden-files: true

      - name: Keep alive
        run: sleep 36000