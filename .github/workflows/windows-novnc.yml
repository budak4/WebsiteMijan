name: windows-novnc

on:
  workflow_dispatch:

jobs:
  wn:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Diagnose VNC server download URLs
        shell: powershell
        run: |
          $urls = @(
            "https://sourceforge.net/projects/ultravnc/files/latest/download",
            "https://sourceforge.net/projects/ultravnc/files/UltraVNC/1.4.3.6/UltraVNC_1_4_3_6_X64_Setup.exe/download",
            "https://sourceforge.net/projects/ultravnc/files/UltraVNC/1.4.3.1/UltraVNC_1_4_3_1_X64_Setup.exe/download",
            "https://downloads.sourceforge.net/project/ultravnc/UltraVNC/1.4.3.6/UltraVNC_1_4_3_6_X64_Setup.exe",
            "https://downloads.tigervnc.org/stable/tigervnc-1.16.2.x86_64.zip",
            "https://downloads.tigervnc.org/stable/tigervnc-1.16.2.x86_64.exe",
            "https://downloads.tigervnc.org/stable/tigervnc-1.15.0.x86_64.zip"
          )
          foreach ($u in $urls) {
            $r = curl.exe -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "C:\dl_probe.bin" -w "%{http_code} %{size_download} %{url_effective}" -m 90 $u 2>&1
            Write-Output ("PROBE " + $u + " => " + $r + " | size=" + ((Get-Item C:\dl_probe.bin -ErrorAction SilentlyContinue).Length))
          }

      - name: Configure password + start VNC server
        shell: powershell
        run: |
          $base = "C:\Program Files\UltraVNC"
          if (-not (Test-Path "$base\winvnc.exe")) { $base = "C:\Program Files (x86)\UltraVNC" }
          if (-not (Test-Path "$base\winvnc.exe")) {
            Write-Output "winvnc.exe absent - download didn't yield UltraVNC. Skipping."
          } else {
          $reg = "HKLM:\SOFTWARE\UltraVNC\Global"
          New-Item -Path $reg -Force | Out-Null
          $key = @(23,82,107,6,35,78,88,7)
          $pw = "sshhmm19"
          $b = New-Object byte[] 8
          for ($i=0; $i -lt 8; $i++) { $c = [int][char]$pw[$i]; $b[$i] = [byte]($c -bxor $key[$i]) }
          New-ItemProperty -Path $reg -Name passwd -Value $b -PropertyType Binary -Force | Out-Null
          New-ItemProperty -Path $reg -Name passwd2 -Value $b -PropertyType Binary -Force | Out-Null
          New-ItemProperty -Path $reg -Name AuthRequired -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $reg -Name PortNumber -Value 5900 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $reg -Name AllowLoopback -Value 1 -PropertyType DWord -Force | Out-Null
          netsh advfirewall firewall add rule name=uvnc dir=in action=allow protocol=TCP localport=5900 | Out-Null
          $svc = Get-Service -Name uvnc_service -ErrorAction SilentlyContinue
          if ($svc) { Set-Service uvnc_service -StartupType Manual; Stop-Service uvnc_service -Force -ErrorAction SilentlyContinue }
          Start-Process -FilePath "$base\winvnc.exe" -RedirectStandardError "C:\winvnc.err" -RedirectStandardOutput "C:\winvnc.out"
          for ($i=0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            if (Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue) { Write-Output "5900 LISTENING"; break }
          }
          if (Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue) {
            Write-Output "VNC UP on 5900"
          } else {
            Write-Output "5900 NOT LISTENING"
            Get-Content "C:\winvnc.err" -ErrorAction SilentlyContinue
          }
          }

      - name: Install noVNC + websockify
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz" -OutFile "C:\novnc.tar.gz"
          New-Item -ItemType Directory -Path "C:\novnc" -Force | Out-Null
          tar -xzf "C:\novnc.tar.gz" -C "C:\novnc"
          python -m pip install --quiet websockify

      - name: Start websockify
        shell: powershell
        run: |
          $webdir = (Get-ChildItem -Path "C:\novnc" -Directory | Select-Object -First 1).FullName
          Write-Output "webdir: $webdir"
          Start-Process -FilePath "python" -ArgumentList @("-m","websockify","--web",$webdir,"6080","localhost:5900") -RedirectStandardOutput "C:\ws.log" -RedirectStandardError "C:\ws.err"
          for ($i=0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            $ln = Get-NetTCPConnection -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue
            if ($ln) { Write-Output "6080 LISTENING"; break }
          }
          Get-Content "C:\ws.log" -ErrorAction SilentlyContinue
          Get-Content "C:\ws.err" -ErrorAction SilentlyContinue

      - name: Start cloudflared tunnel
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe" -TimeoutSec 120
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList @("tunnel","--url","http://localhost:6080","--no-autoupdate") -RedirectStandardOutput "C:\cf.log" -RedirectStandardError "C:\cf.err"
          $url = ""
          for ($i=0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 3
            $log = (Get-Content "C:\cf.log" -Raw -ErrorAction SilentlyContinue) + (Get-Content "C:\cf.err" -Raw -ErrorAction SilentlyContinue)
            if ($log -match 'https://([a-z0-9-]+)\.trycloudflare\.com') { $url = $Matches[0]; break }
          }
          Write-Output "URL=$url"
          Set-Content -Path "C:\vnc\info.txt" -Value "url=$url"
          Add-Content -Path "C:\vnc\info.txt" -Value "password=sshhmm19"
          Add-Content -Path "C:\vnc\info.txt" -Value ""
          Add-Content -Path "C:\vnc\info.txt" -Value "=== diag ==="
          Add-Content -Path "C:\vnc\info.txt" -Value ("5900=" + [bool](Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue))
          Add-Content -Path "C:\vnc\info.txt" -Value ("6080=" + [bool](Get-NetTCPConnection -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue))
          Add-Content -Path "C:\vnc\info.txt" -Value "=== winvnc.out ==="
          Add-Content -Path "C:\vnc\info.txt" -Value (Get-Content "C:\winvnc.out" -Raw -ErrorAction SilentlyContinue)
          Add-Content -Path "C:\vnc\info.txt" -Value "=== winvnc.err ==="
          Add-Content -Path "C:\vnc\info.txt" -Value (Get-Content "C:\winvnc.err" -Raw -ErrorAction SilentlyContinue)
          Add-Content -Path "C:\vnc\info.txt" -Value "=== ws.log ==="
          Add-Content -Path "C:\vnc\info.txt" -Value (Get-Content "C:\ws.log" -Raw -ErrorAction SilentlyContinue)
          Add-Content -Path "C:\vnc\info.txt" -Value "=== ws.err ==="
          Add-Content -Path "C:\vnc\info.txt" -Value (Get-Content "C:\ws.err" -Raw -ErrorAction SilentlyContinue)
          Add-Content -Path "C:\vnc\info.txt" -Value "=== cf.log ==="
          Add-Content -Path "C:\vnc\info.txt" -Value (Get-Content "C:\cf.log" -Raw -ErrorAction SilentlyContinue)
          Add-Content -Path "C:\vnc\info.txt" -Value "=== cf.err ==="
          Add-Content -Path "C:\vnc\info.txt" -Value (Get-Content "C:\cf.err" -Raw -ErrorAction SilentlyContinue)
          Get-Content "C:\vnc\info.txt"

      - name: Upload info
        uses: actions/upload-artifact@v4
        with:
          name: windows-novnc
          path: C:\vnc\info.txt

      - name: Keep alive
        shell: powershell
        run: Start-Sleep -Seconds 21600