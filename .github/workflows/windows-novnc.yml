name: windows-novnc

on:
  workflow_dispatch:

jobs:
  wn:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Install TightVNC
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "C:\vnc" -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/hello-smile6/NoVNC-windows/releases/download/python/tightvnc.tgz" -OutFile "C:\tightvnc.tgz" -TimeoutSec 300
          Write-Output ("tgz size: " + (Get-Item C:\tightvnc.tgz).Length)
          New-Item -ItemType Directory -Path "C:\tvnc" -Force | Out-Null
          tar -xzf "C:\tightvnc.tgz" -C "C:\tvnc"
          Get-ChildItem -Path "C:\tvnc" -Recurse -File | Select-Object -First 40 -ExpandProperty FullName
          $tvn = Get-ChildItem -Path "C:\tvnc" -Recurse -Filter "tvnserver.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          $tvnCtrl = Get-ChildItem -Path "C:\tvnc" -Recurse -Filter "TVNControl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "tvnserver: $tvn"
          Write-Output "TVNControl: $tvnCtrl"
          if (-not $tvn) {
            $tvn = Get-ChildItem -Path "C:\tvnc" -Recurse -Filter "tvnserver*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $tvn) { throw "tvnserver.exe not found" }
          Set-Content -Path "C:\vnc\tvn.txt" -Value $tvn
          $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($tvn)
          Write-Output "tvnserver FileVersion: $($v.FileVersion) ProductVersion: $($v.ProductVersion)"

      - name: Configure password + start TightVNC
        shell: powershell
        run: |
          $tvn = (Get-Content "C:\vnc\tvn.txt" -Raw).Trim()
          $encVintage = [byte[]](0x27,0x84,0xAF,0xB3,0xAA,0x74,0x74,0x8F)
          $encPlain   = [byte[]](0x41,0xB6,0xB1,0x0C,0xB9,0xF7,0x9D,0x44)
          $roots = @(
            "HKCU:\Software\TightVNC\Server",
            "HKLM:\Software\TightVNC\Server",
            "HKLM:\Software\ORL\WinVNC3\Default"
          )
          function Set-Pass($enc) {
            foreach ($r in $roots) {
              New-Item -Path $r -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name AllowLoopback -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name LoopbackOnly -Value 0 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name AuthRequired -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name Password -Value $enc -PropertyType Binary -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name PasswordViewOnly -Value $enc -PropertyType Binary -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name ControlPassword -Value $enc -PropertyType Binary -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name UseControlPassword -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name RfbPort -Value 5900 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $r -Name PortNumber -Value 5900 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
            }
            Write-Output "password written"
          }
          Set-Pass $encVintage
          netsh advfirewall firewall add rule name=tvn dir=in action=allow protocol=TCP localport=5900 | Out-Null
          Stop-Process -Name tvnserver -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          schtasks /create /tn tvn /tr "`"$tvn`" -run" /sc once /st 00:00 /rl highest /f | Out-Null
          schtasks /run /tn tvn
          Start-Sleep -Seconds 8
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $ns = netstat -ano | Select-String ":5900\s.*LISTEN"
            if ($ns) { Write-Output "5900 LISTENING (netstat)"; break }
          }
          $ns = netstat -ano | Select-String ":5900\s.*LISTEN"
          if ($ns) {
            Write-Output "TIGH TVNC UP on 5900"
            Write-Output $ns
          } else {
            Write-Output "5900 NOT LISTENING"
            tasklist | Select-String "tvn" | ForEach-Object { Write-Output $_ }
            Get-Service | Where-Object { $_.Name -match "tvn|tight|vnc" } | ForEach-Object { Write-Output ("svc " + $_.Name + " " + $_.Status) }
          }

      - name: Test VNC auth over loopback
        shell: powershell
        run: |
          pip install -q vncdotool 2>$null | Out-Null
          cmd /c "python -c ""import base64;open('C:/vnc/vnctest.py','w').write(base64.b64decode(''))"" > C:\vnc\w1.txt 2>&1"
          cmd /c "python -c ""import vncdotool; print('IMPORT_OK')"" > C:\vnc\w2.txt 2>&1"
          cmd /c "python C:\vnc\vnctest.py > C:\vnc\w3.txt 2>&1"
          $diag = @()
          $diag += "write_file: " + ((Get-Content C:\vnc\w1.txt -Raw -ErrorAction SilentlyContinue).Trim())
          $diag += "import_out: " + ((Get-Content C:\vnc\w2.txt -Raw -ErrorAction SilentlyContinue).Trim())
          $diag += "test_out: " + ((Get-Content C:\vnc\w3.txt -Raw -ErrorAction SilentlyContinue).Trim())
          if ((Get-Content C:\vnc\w3.txt -Raw -ErrorAction SilentlyContinue) -match "AUTH_OK") { $diag += "VERDICT_OK" } else { $diag += "VERDICT_FAIL" }
          $diag | ForEach-Object { Write-Output "diag: $_" }
          Set-Content -Path "C:\vnc\auth.txt" -Value $diag

      - name: Install noVNC + websockify
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz" -OutFile "C:\novnc.tar.gz"
          New-Item -ItemType Directory -Path "C:\novnc" -Force | Out-Null
          tar -xzf "C:\novnc.tar.gz" -C "C:\novnc"
          python -m pip install --quiet websockify
          $webdir = (Get-ChildItem -Path "C:\novnc" -Directory | Select-Object -First 1).FullName
          Set-Content "C:\vnc\webdir.txt" -Value $webdir
          Set-Content "C:\vnc\python.txt" -Value ((Get-Command python -ErrorAction SilentlyContinue).Source)
          Write-Output "webdir=$webdir"

      - name: Start websockify
        shell: powershell
        run: |
          $webdir = (Get-Content "C:\vnc\webdir.txt" -Raw).Trim()
          $py = (Get-Content "C:\vnc\python.txt" -Raw).Trim()
          schtasks /create /tn websockify /tr "`"$py`" -m websockify --web `"$webdir`" 6080 localhost:5900" /sc once /st 00:00 /rl highest /f | Out-Null
          schtasks /run /tn websockify
          Start-Sleep -Seconds 5
          for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            $ns = netstat -ano | Select-String ":6080\s.*LISTEN"
            if ($ns) { Write-Output "6080 LISTENING (netstat)"; break }
          }
          $ns = netstat -ano | Select-String ":6080\s.*LISTEN"
          if ($ns) { Write-Output $ns } else { Write-Output "6080 NOT LISTENING" }

      - name: Start cloudflared tunnel
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe" -TimeoutSec 120
          Set-Content -Path "C:\cftun.cmd" -Value "C:\cloudflared.exe tunnel --url http://localhost:6080 --no-autoupdate > C:\cf.log 2>&1"
          schtasks /create /tn cftun /tr "C:\cftun.cmd" /sc once /st 00:00 /rl highest /f | Out-Null
          schtasks /run /tn cftun
          $url = ""
          for ($i=0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 3
            $log = Get-Content "C:\cf.log" -Raw -ErrorAction SilentlyContinue
            if ($log -match 'https://([a-z0-9-]+)\.trycloudflare\.com') { $url = $Matches[0]; break }
          }
          Write-Output "URL=$url"
          Set-Content -Path "C:\vnc\info.txt" -Value "url=$url"
          Add-Content -Path "C:\vnc\info.txt" -Value "password=sshhmm19"

      - name: Upload info
        uses: actions/upload-artifact@v4
        with:
          name: windows-novnc
          path: |
            C:\vnc\info.txt
            C:\vnc\auth.txt
          overwrite: true

      - name: Final verify
        shell: powershell
        run: |
          Start-Sleep -Seconds 8
          $out = @()
          $out += "=== netstat ==="
          $out += (netstat -ano | Select-String "LISTEN") | Select-String "5900|6080"
          $out += "=== tasklist tvn ==="
          $out += tasklist | Select-String "tvn"
          $out += "=== tasklist python ==="
          $out += tasklist | Select-String "python"
          $out += "=== vnc services ==="
          $out += Get-Service | Where-Object { $_.Name -match "tvn|tight|vnc|uvnc" } | ForEach-Object { "svc " + $_.Name + " " + $_.Status }
          $out += "=== tasklist cloudflared ==="
          $out += tasklist | Select-String "cloudflared"
          if (Test-Path "C:\vnc\vnctest.py") {
            cmd /c "python C:\vnc\vnctest.py > C:\vnc\w4.txt 2>&1"
            $add = @("final_out: " + ((Get-Content C:\vnc\w4.txt -Raw -ErrorAction SilentlyContinue).Trim()))
            Add-Content -Path "C:\vnc\auth.txt" -Value $add -ErrorAction SilentlyContinue
            $out += ("FINAL_AUTH=" + ((Get-Content C:\vnc\w4.txt -Raw -ErrorAction SilentlyContinue).Trim()))
          } else {
            $out += "vnctest.py missing"
          }
          $url2 = (Get-Content "C:\vnc\info.txt" | Select-String "url=").Line -replace '^url=',''
          if ($url2) {
            $code = curl.exe -sS -m 20 -o NUL -w "%{http_code}" "$url2/vnc.html" 2>&1
            $out += "selftest $url2/vnc.html -> $code"
          } else {
            $out += "selftest skipped (no url)"
          }
          $out += "=== cf.log tail ==="
          $out += Get-Content "C:\cf.log" -Tail 20 -ErrorAction SilentlyContinue
          Set-Content "C:\vnc\final.txt" -Value $out
          Get-Content "C:\vnc\final.txt"
          $url = (Get-Content "C:\vnc\info.txt" | Select-String "url=").Line -replace '^url=',''
          if (-not $url) { $url = (Get-Content "C:\cf.err" -Raw -ErrorAction SilentlyContinue) | Select-String 'https://[a-z0-9-]+\.trycloudflare\.com' | Select-Object -First 1 }
          $out = @()
          $out += "url=$url"
          $out += "password=sshhmm19"
          $out += ""
          $out += $out[2..($out.Count-1)]
          $out2 = @("url=$url","password=sshhmm19") + $out[2..999] + (Get-Content "C:\vnc\final.txt")
          Set-Content "C:\vnc\info.txt" -Value $out2

      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: windows-novnc
          path: |
            C:\vnc\info.txt
            C:\vnc\auth.txt
          overwrite: true

      - name: Keep alive
        shell: powershell
        run: Start-Sleep -Seconds 21600