name: windows-rdp

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP + set password
        shell: powershell
        run: |
          $Password = "GhaRdp#2709"
          net user runneradmin $Password
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          Write-Output "RDP enabled, user=runneradmin"

      - name: Install bore (bore.pub tunnel)
        shell: powershell
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/ekzhang/bore/releases/latest" -Headers @{ "User-Agent" = "GHA" }
          $asset = $rel.assets | Where-Object { $_.name -match 'x86_64-windows-msvc.zip' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match 'windows' } | Select-Object -First 1 }
          Write-Output "downloading: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\bore.zip"
          Expand-Archive "$env:TEMP\bore.zip" -DestinationPath "C:\bore" -Force
          Get-ChildItem -Path "C:\bore" -Recurse -Filter "bore.exe" | Select-Object -First 1 -ExpandProperty FullName

      - name: Start bore tunnel (RDP 3389)
        shell: powershell
        run: |
          $bore = (Get-ChildItem -Path "C:\bore" -Recurse -Filter "bore.exe" | Select-Object -First 1).FullName
          Write-Output "bore: $bore"
          Start-Process -FilePath $bore -ArgumentList @("local","3389","--to","bore.pub") -RedirectStandardOutput "C:\bore\bore.log" -RedirectStandardError "C:\bore\bore.err"
          $url = ""
          for ($i=0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 3
            $log = Get-Content "C:\bore\bore.log" -Raw -ErrorAction SilentlyContinue
            if ($log -match 'bore\.pub:(\d+)') { $url = "bore.pub:$($matches[1])"; break }
            $log = Get-Content "C:\bore\bore.err" -Raw -ErrorAction SilentlyContinue
            if ($log -match 'bore\.pub:(\d+)') { $url = "bore.pub:$($matches[1])"; break }
          }
          Write-Output "RDP_HOST=$url"
          Set-Content -Path "C:\bore\rdp-url.txt" -Value "host=$url  user=runneradmin  pass=GhaRdp#2709"
          Add-Content -Path "C:\bore\rdp-url.txt" -Value ""
          Add-Content -Path "C:\bore\rdp-url.txt" -Value "--- bore.log ---"
          Add-Content -Path "C:\bore\rdp-url.txt" -Value (Get-Content "C:\bore\bore.log" -Raw -ErrorAction SilentlyContinue)
          Get-Content "C:\bore\rdp-url.txt"

      - name: Upload RDP URL
        uses: actions/upload-artifact@v4
        with:
          name: rdp-url
          path: C:\bore\rdp-url.txt

      - name: Keep alive
        shell: powershell
        run: Start-Sleep -Seconds 21600