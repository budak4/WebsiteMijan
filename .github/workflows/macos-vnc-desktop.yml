name: novnc-macos-desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Enable built-in VNC (Screen Sharing)
        run: |
          echo "=== windowserver / session ==="
          ps aux | grep -E 'WindowServer|loginwindow' | grep -v grep || echo "NO WINDOWSERVER"
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ARD_AllLocalUsers -bool true
          ARD=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$ARD" -activate -configure -access on -restart -agent -privs -all -menu
          sudo "$ARD" -configure -allowAccessFor -allUsers -privs -all
          sudo "$ARD" -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw sshhmm1900 -setvnclocalsave -vnclocalsave no
          sudo launchctl enable system/com.apple.screensharing || true
          sudo launchctl kickstart -kp system/com.apple.screensharing || true
          sudo "$ARD" -restart -agent -console || true
          sleep 10
          echo "=== list screen services ==="
          sudo launchctl list 2>/dev/null | grep -iE 'screen|remote' || true
          echo "=== vnc port (retry) ==="
          for i in $(seq 1 8); do
            L=$(sudo lsof -iTCP:5900 -sTCP:LISTEN -P -n 2>/dev/null)
            [ -n "$L" ] && echo "$L" && break
            sleep 3
          done
          sudo lsof -iTCP:5900 -sTCP:LISTEN -P -n || echo "5900 NOT LISTENING"

      - name: Install noVNC + websockify
        run: |
          python3 -m pip install --user -q --break-system-packages websockify
          curl -sL https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.tar.gz | tar xz -C /tmp
          ls -d /tmp/noVNC-1.5.0
          ~/Library/Python/3.*/bin/websockify --version 2>/dev/null || python3 -c "import websockify; print('websockify ok')"

      - name: Start noVNC
        run: |
          NOVNC_DIR=/tmp/noVNC-1.5.0
          echo "novnc dir: $NOVNC_DIR"
          WS=$(ls "$HOME"/Library/Python/3.*/bin/websockify 2>/dev/null | head -1)
          if [ -z "$WS" ]; then WS="python3 -m websockify"; fi
          echo "websockify: $WS"
          $WS --web="$NOVNC_DIR" 6080 localhost:5900 </dev/null >/tmp/ws.log 2>&1 &
          for i in $(seq 1 10); do
            nc -z localhost 6080 && break
            sleep 2
          done
          nc -z localhost 5900 && echo "vnc 5900 ok" || echo "vnc 5900 FAIL"
          cat /tmp/ws.log
          netstat -an | grep -E '\.5900|\.6080' | grep LISTEN || true

      - name: Diagnostics
        run: |
          {
            echo "=== vnc listen ===";
            sudo lsof -iTCP:5900 -P -n || true;
            echo "=== ports ===";
            netstat -an | grep -E '\.5900|\.6080' | grep LISTEN || true;
            echo "=== rfb handshake test ===";
            python3 -c "import socket; s=socket.create_connection(('localhost',5900),timeout=5); v=s.recv(12); print('server version:',v); s.sendall(b'RFB 003.008'+chr(10)); n=s.recv(1)[0]; print('sectypes count:',n,'types:',s.recv(n))" 2>&1 || echo "RFB TEST FAILED";
            echo "=== websockify log ===";
            cat /tmp/ws.log 2>/dev/null || true;
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: /tmp/diag.txt
          include-hidden-files: true

      - name: Start cloudflared tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz -o /tmp/cfd.tgz
          tar -xzf /tmp/cfd.tgz -C /tmp
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "$URL" > desktop-url.txt
          echo "::notice title=Open Desktop (macOS)::Buka URL -> $URL  (password: sshhmm1900)"
          tail -5 /tmp/tunnel.log

      - name: Upload desktop URL
        uses: actions/upload-artifact@v4
        with:
          name: desktop-url
          path: desktop-url.txt
          include-hidden-files: true

      - name: Keep alive
        run: sleep 36000